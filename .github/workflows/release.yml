name: 릴리스

# v로 시작하는 태그를 밀면 릴리스를 만든다. 이 워크플로가 없으면
# releases/latest가 404라 대시보드의 업데이트 알림이 영원히 안 뜬다.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 태그만 밀고 server.py의 VERSION을 안 올리면 대시보드가 헌 번호를 계속 보여준다
      - name: 태그와 server.py의 VERSION이 같은지
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('server.py').read()).group(1))")
          echo "태그 $tag / VERSION $ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::태그($tag)와 server.py의 VERSION($ver)이 다릅니다"
            exit 1
          fi

      - name: 전체 검사
        run: |
          fail=0
          for t in tests/test_*.py; do
            echo "── $t"
            python3 "$t" || fail=1
          done
          exit $fail

      # CHANGELOG.md에 이 버전 항목이 있으면 그걸 쓰고, 없으면 커밋 목록으로 만든다
      - name: 릴리스 노트 준비
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ -f CHANGELOG.md ] && grep -q "^## $tag" CHANGELOG.md; then
            awk "/^## $tag/{f=1;next} /^## /{f=0} f" CHANGELOG.md > /tmp/notes.md
            echo "source=changelog" >> "$GITHUB_OUTPUT"
          else
            : > /tmp/notes.md
            echo "source=commits" >> "$GITHUB_OUTPUT"
          fi

      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.notes.outputs.source }}" = "changelog" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # Homebrew 수식은 다른 저장소(homebrew-tap)에 있다. 기본 토큰은 이 저장소까지만
  # 권한이 있어서, TAP_DEPLOY_KEY를 넣어두기 전까지 이 작업은 건너뛴다.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: 배포 키가 있는지
        id: has_key
        run: |
          if [ -n "${{ secrets.TAP_DEPLOY_KEY }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "TAP_DEPLOY_KEY가 없어 Homebrew 수식 갱신을 건너뜁니다. 손으로 sha256을 바꿔야 합니다."
          fi

      - name: tap 받기
        if: steps.has_key.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: ganggangstone/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: 수식의 url과 sha256을 새 태그로 바꾸기
        if: steps.has_key.outputs.ok == 'true'
        run: |
          tag="$GITHUB_REF_NAME"
          tarball="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${tag}.tar.gz"
          # 태그 tarball이 준비될 때까지 잠깐 기다린다
          for i in 1 2 3 4 5; do
            if curl -fsSL "$tarball" -o /tmp/src.tar.gz; then break; fi
            sleep 5
          done
          sha=$(sha256sum /tmp/src.tar.gz | cut -d' ' -f1)
          echo "sha256 $sha"
          f=tap/Formula/agent-hud.rb
          # 수식에 version 필드는 없다. Homebrew가 url의 태그에서 버전을 읽는다
          python3 - "$f" "$tarball" "$sha" <<'PY'
          import re, sys
          path, url, sha = sys.argv[1:4]
          s = open(path).read()
          s2 = re.sub(r'url "[^"]+"', f'url "{url}"', s, count=1)
          s2 = re.sub(r'sha256 "[^"]+"', f'sha256 "{sha}"', s2, count=1)
          if s2 == s:
              sys.exit("수식에서 url/sha256을 못 찾았습니다")
          open(path, "w").write(s2)
          PY
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agent-hud.rb
          git commit -m "agent-hud ${tag}" || { echo "바뀐 게 없습니다"; exit 0; }
          git push
