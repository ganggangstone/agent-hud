name: 검사

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # tests/test_page_js.py와 test_landing.py가 인라인 스크립트를 node --check로 본다
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 토큰 수 검사는 진짜 tiktoken(o200k_base)으로 돈다. 설치와 어휘 내려받기는 여기서 한 번만 하고,
      # 검사들은 같은 폴더를 AGENT_HUD_TEST_TOKENIZER_HOME 으로 받아 쓴다.
      - name: 토큰 수 도구 준비
        run: AGENT_HUD_HOME="$RUNNER_TEMP/hud-tokens" python3 server.py tokens setup

      - name: 전체 검사
        env:
          AGENT_HUD_TEST_TOKENIZER_HOME: ${{ runner.temp }}/hud-tokens
        run: |
          fail=0
          for t in tests/test_*.py; do
            echo "── $t"
            python3 "$t" || fail=1
          done
          exit $fail
